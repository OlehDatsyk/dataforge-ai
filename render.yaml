services:
  - type: web
    name: dataforge-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ANTHROPIC_MODEL
        value: claude-3-5-haiku-20241022
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: PRIMARY_AI_PROVIDER
        value: openai
      - key: FALLBACK_AI_PROVIDER
        value: anthropic
      - key: SECONDARY_FALLBACK_AI_PROVIDER
        value: gemini
      - key: MAX_UPLOAD_SIZE_MB
        value: "15"
      - key: MAX_ROWS
        value: "100000"
      - key: DATABASE_URL
        sync: false
      - key: AI_REQUEST_TIMEOUT_SECONDS
        value: "30"

# NOTE: No secrets are stored in this file. API keys must be set manually
# in the Render dashboard under Environment. See README.md / INSTRUCTION.md
# for the full deployment walkthrough.
